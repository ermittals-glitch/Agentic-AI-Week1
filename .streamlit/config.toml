[theme]
base = "light"
primaryColor = "#147D8A"
backgroundColor = "#F5F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
linkColor = "#0D6875"
borderColor = "#DCE7ED"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#F0F5F8"
secondaryBackgroundColor = "#FFFFFF"

[browser]
gatherUsageStats = false
